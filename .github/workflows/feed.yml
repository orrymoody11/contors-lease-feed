name: Lease feed
on:
  schedule:
    - cron: '37 11 * * *'
    - cron: '37 23 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'reader/**'
      - '.github/workflows/feed.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: lease-feed
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Read the lease sources
        run: bash reader/run.sh
      - name: Prepare feed for Pages
        run: |
          test -s out/leases.json || { echo "No feed was produced; keeping the last published one."; exit 1; }
          mkdir -p _site
          cp out/leases.json _site/leases.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
      - name: Alert if any source failed
        run: node -e "const r=require('./out/leases-report.json'); if(!r.ok){console.log(r.issues.join('\n')); process.exit(1)}"
